services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: fastrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fastrag-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge_base:/code/knowledge_base:ro
    depends_on:
      qdrant:
        condition: service_healthy

  ingest:
    build: .
    container_name: fastrag-ingest
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./knowledge_base:/code/knowledge_base:ro
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "-m", "app.ingest"]
    profiles:   # This service will only run when the 'ingest' profile is specified [it should be run manually when needed using docker compose --profile ingest run --rm ingest]
      - ingest

volumes:
  qdrant_storage:
